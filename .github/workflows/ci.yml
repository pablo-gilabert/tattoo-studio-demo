name: Quality checks

on:
    push:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies and retrieve demo photography
              run: npm install

            - name: Check TypeScript types
              run: npm run typecheck

            - name: Build production bundle
              run: npm run build
